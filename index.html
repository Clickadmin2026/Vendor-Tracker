<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Networks · Vendor & Partner Tracker</title><meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#171d2b;--line:#232b3d;--tx:#e8ecf4;--mu:#8b95aa;--ac:#6ea8fe;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b7a;--vio:#b392f0}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--panel:#fff;--panel2:#f0f3fa;--line:#dde3ef;--tx:#151a27;--mu:#5d6882;--ac:#2f6df6;--ok:#10905a;--warn:#b86e00;--bad:#d1293d;--vio:#6c44c9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
header{padding:22px 28px 6px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:-.02em}h1 span{color:var(--mu);font-weight:500}
.sub{color:var(--mu);font-size:12.5px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:14px 28px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--ac)}.tile b{font-size:26px;letter-spacing:-.03em;display:block}.tile small{color:var(--mu)}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:6px 28px 12px;align-items:center;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:5}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;outline:none}
input[type=search]{min-width:260px;flex:1;max-width:420px}input:focus,select:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mu);padding:9px 13px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}.btn:hover{border-color:var(--ac)}
.wrap{padding:0 28px 60px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:980px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);text-align:left;padding:4px 12px;cursor:pointer;user-select:none;white-space:nowrap}
td{background:var(--panel);padding:11px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
tr.r{cursor:pointer}tr.r:hover td{background:var(--panel2);border-color:var(--ac)}
.nm{font-weight:600}.nm small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.s-success i{background:var(--ok)}.s-login-issue i{background:var(--bad)}.s-pending i,.s-open i{background:var(--warn)}.s-julie-to-verify i{background:var(--vio)}.s-delisted i{background:var(--mu)}
.t1{background:linear-gradient(135deg,#6ea8fe33,#b392f033);border-color:var(--ac);font-weight:600}.t2{border-color:var(--vio);color:var(--vio);font-weight:600}.tp{border:1px dashed var(--warn);color:var(--warn);font-weight:600}
.ql a{display:inline-block;margin:0 3px 3px 0;padding:1px 8px;border-radius:6px;font-size:11.5px;color:var(--ac);background:var(--panel2);border:1px solid var(--line);text-decoration:none}.ql a:hover{border-color:var(--ac)}
.mut{color:var(--mu)}.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.old{color:var(--bad)}
aside{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:.22s;z-index:20;overflow:auto;padding:22px 24px 80px;box-shadow:-20px 0 60px #0006}
aside.open{transform:none}aside h2{margin:0 0 4px;font-size:20px}aside h4{margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
pre{white-space:pre-wrap;margin:0;font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:240px;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}aside input,aside select,aside textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
.x{position:absolute;top:14px;right:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;margin:0 5px 5px 0;padding:2px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.edited{color:var(--warn);font-size:11px}.empty{padding:50px;text-align:center;color:var(--mu)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px;z-index:50;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
:root{--bg:#0a0f1e;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--tx:#f5f7ff;--mu:#a3adc7;--ac:#0a84ff;--ok:#32d74b;--warn:#ffd60a;--bad:#ff453a;--vio:#bf5af2}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:var(--bg);min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 15%,#0a84ff88,transparent 70%),radial-gradient(35% 35% at 85% 20%,#bf5af277,transparent 70%),radial-gradient(40% 40% at 70% 90%,#32d7a455,transparent 70%),radial-gradient(35% 30% at 10% 85%,#ff9f0a44,transparent 70%);filter:blur(30px)}
:root{--blur:blur(24px) saturate(180%)}
.tile,td,.seg,input[type=search],select,.btn,aside,.bar>*{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tile{border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 30px rgba(0,0,0,.18)}
.tile:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.4)}
td{border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
td:first-child{border-radius:18px 0 0 18px}td:last-child{border-radius:0 18px 18px 0}
tr.r:hover td{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
tr.r{transition:transform .15s}tr.r:hover{transform:scale(1.003)}
input[type=search],select,.btn,.seg{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.seg button{border-radius:11px;margin:3px;padding:6px 12px}.seg button.on{background:var(--ac);box-shadow:0 2px 10px #0a84ff66}
.btn{font-weight:500}.btn:hover{background:rgba(255,255,255,.18)}
.bar{background:none;padding-top:10px}
.chip,.pill,.ql a{backdrop-filter:blur(10px);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.t1{background:linear-gradient(135deg,#0a84ffcc,#bf5af2cc);color:#fff;border-color:transparent}
aside{border-radius:28px 0 0 28px;background:rgba(24,28,45,.55);border:1px solid rgba(255,255,255,.18);box-shadow:-20px 0 80px rgba(0,0,0,.4)}
pre,aside input,aside select,aside textarea{border-radius:14px;background:rgba(255,255,255,.07)}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
th{font-weight:600}
.toast{border-radius:99px;backdrop-filter:var(--blur)}

const LS='vendorTrackerEdits.v1';let edits={};try{edits=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
let V=[];
const PROPOSED=new Set(['RSA']);
const eff=v=>({...v,...(edits[v.name]||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const STATES={'success':'Verified','login-issue':'Login issue','pending':'Pending','julie to verify':'Julie to verify','delisted':'Delisted','open':'Open','unchecked':'Unchecked'};
const sk=s=>'s-'+s.replace(/ /g,'-');
const cols=[['name','Vendor'],['tier','Tier'],['status','Partner status'],['distis','Distributor'],['vstate','Portal check'],['vdate','Last verified'],['links','Quick links']];
let sort={k:'tier',d:1},F={t:'all',q:'',v:'',d:'',p:''};
function topTier(v){return v.tier===1||v.tier===2||PROPOSED.has(v.name)&&!v.tier}
function tierChip(v){if(v.tier===1)return'<span class="chip t1">Tier 1</span>';if(v.tier===2)return'<span class="chip t2">Tier 2</span>';if(PROPOSED.has(v.name))return'<span class="chip tp" title="Boss flagged RSA as a missing Top Tier. Confirm and set the tier.">Top Tier? set tier</span>';return'<span class="mut">—</span>'}
function match(v){
 if(F.t==='top'&&!topTier(v))return false;if((F.t==='1'||F.t==='2')&&v.tier!=+F.t)return false;
 if(F.v&&v.vstate!==F.v)return false;if(F.d&&!v.distis.includes(F.d))return false;if(F.p&&!v.vehicles.some(x=>x.startsWith(F.p)))return false;
 if(F.q){const h=(v.name+' '+v.status+' '+v.pid+' '+v.engineers.join(' ')+' '+v.contacts+' '+v.distis.join(' ')+' '+v.vehicles.join(' ')+' '+v.competitors.join(' ')+' '+v.notes+' '+v.growth+' '+v.vertical).toLowerCase();
  return F.q.toLowerCase().split(/\s+/).every(w=>h.includes(w))}return true}
function render(){
 const all=V.map(eff);const rows=all.filter(match);
 const k=sort.k;rows.sort((a,b)=>{let x=a[k],y=b[k];if(k==='tier'){x=x||(PROPOSED.has(a.name)?1.5:9);y=y||(PROPOSED.has(b.name)?1.5:9)}if(k==='distis'||k==='links'){x=k==='links'?Object.keys(x).length:x.join();y=k==='links'?Object.keys(y).length:y.join()}
  x=x??'';y=y??'';return (x>y?1:x<y?-1:0)*sort.d||a.name.localeCompare(b.name)});
 $('#thead').innerHTML=cols.map(([c,l])=>`<th data-k="${c}">${l}${sort.k===c?(sort.d>0?' ▲':' ▼'):''}</th>`).join('');
 $('#tb').innerHTML=rows.map(v=>{const L=v.links;const ql=['Partner Portal','Training','Deal Reg','Program Guide','Incentives','Sales Tools'].filter(x=>L[x]).map(x=>`<a href="${esc(L[x])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${x.replace('Partner ','').replace('Program ','Prog. ')}</a>`).join('');
 return`<tr class="r" data-i="${v.id}"><td class="nm">${esc(v.name)}${edits[v.name]?' <span class="edited">● edited</span>':''}<small>${esc(v.engineers.length?'🎓 '+v.engineers[0].split('(')[0].trim():'')}</small></td><td>${tierChip(v)}</td>
 <td>${v.status?esc(v.status):'<span class="mut">—</span>'}</td><td>${v.distis.map(d=>`<span class="pill">${esc(d)}</span>`).join('')||'<span class="mut">—</span>'}</td>
 <td><span class="chip ${sk(v.vstate)}"><i></i>${STATES[v.vstate]||esc(v.vstate)}</span></td><td class="mono mut">${v.vdate||'—'}</td><td class="ql">${ql||'<span class="mut">—</span>'}</td></tr>`}).join('');
 $('#empty').hidden=rows.length>0;
 const n=all.length,top=all.filter(topTier).length;
 $('#sub').textContent=`${rows.length} of ${n} vendors shown · source: Vendor_Tracker.xlsx · edits save in this browser`;
 const cnt=s=>all.filter(v=>v.vstate===s).length;
 $('#tiles').innerHTML=[['all',n,'Vendors tracked'],['top',top,'Tier 1 + 2 (incl. RSA to confirm)'],['success',cnt('success'),'Portals verified'],['login-issue',cnt('login-issue'),'Login issues'],['pending',cnt('pending')+cnt('julie to verify'),'Pending / to verify']].map(([f,c,l])=>`<div class="tile" data-f="${f}"><b>${c}</b><small>${l}</small></div>`).join('');
 $('#watch').innerHTML=`<h4 class="mut" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">Under consideration</h4>`+DATA.w.map(w=>`<span class="pill">${esc(w.name)} · ${esc(w.reason)}${w.tech?' · '+esc(w.tech):''}</span>`).join('')}
function drawer(id){const v=eff(V[id]);const base=V[id];const L=Object.entries(v.links);
 const noteLines=(v.notes||'').split('\n').filter(Boolean);
 $('#dr').innerHTML=`<button class="btn x" onclick="closeD()">✕</button><h2>${esc(v.name)}</h2><div>${tierChip(v)} ${v.status?`<span class="chip">${esc(v.status)}</span>`:''} <span class="chip ${sk(v.vstate)}"><i></i>${STATES[v.vstate]||esc(v.vstate)}${v.vdate?' · '+v.vdate:''}</span></div>
 ${v.growth?`<h4>Growth opportunity / requirements</h4><pre>${esc(v.growth)}</pre>`:''}
 <h4>Links</h4><div class="ql">${L.map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join('')||'<span class="mut">No links</span>'}</div>
 ${v.pid?`<h4>Partner ID</h4><div class="mono">${esc(v.pid)}</div>`:''}
 ${v.vehicles.length?`<h4>Purchasing vehicle</h4>${v.vehicles.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}`:''}
 ${v.distis.length?`<h4>Distributor</h4>${v.distis.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}`:''}
 ${v.distiContacts?`<h4>Disti contacts</h4><pre>${esc(v.distiContacts)}</pre>`:''}
 ${v.contacts?`<h4>Vendor contacts</h4><pre>${esc(v.contacts)}</pre>`:''}
 ${v.engineers.length?`<h4>Click engineers / certs</h4><pre>${esc(v.engineers.join('\n'))}</pre>`:''}
 ${v.competitors.length?`<h4>Competitors</h4>${v.competitors.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}`:''}
 ${noteLines.length?`<h4>Notes & change log (${noteLines.length})</h4><pre>${esc(noteLines.slice().reverse().join('\n'))}</pre>`:''}
 <h4>Edit</h4><div class="grid2"><div><label>Tier</label><select id="e_tier"><option value="">None</option><option ${v.tier===1?'selected':''} value="1">1</option><option ${v.tier===2?'selected':''} value="2">2</option></select></div>
 <div><label>Partner status</label><input id="e_status" value="${esc(v.status)}"></div>
 <div><label>Portal check</label><select id="e_vs">${Object.entries(STATES).map(([k,l])=>`<option value="${k}" ${v.vstate===k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div><label>Last verified</label><input type="date" id="e_vd" value="${v.vdate||''}"></div></div>
 <label>Growth opportunity / requirements</label><textarea id="e_g" rows="3">${esc(v.growth)}</textarea>
 <label>Add a note (dated automatically)</label><textarea id="e_n" rows="2" placeholder="e.g. Verified Elite letter attached"></textarea>
 <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" style="background:var(--ac);color:#fff" onclick="save(${id})">Save</button>${edits[v.name]?`<button class="btn" onclick="revert(${id})">Revert vendor</button>`:''}</div>
 <p class="mut" style="font-size:12px">Edits are stored in your browser only. Use "Copy edits (JSON)" to share them; they'll move to a shared database in the GitHub version.</p>`;
 $('#dr').classList.add('open');location.hash=encodeURIComponent(base.name).replace(/%/g,'').slice(0,40).replace(/[^A-Za-z0-9-]/g,'-')}
function closeD(){$('#dr').classList.remove('open');history.replaceState(null,'',location.pathname)}
function save(id){const b=V[id],e=edits[b.name]||{};const t=$('#e_tier').value;e.tier=t?+t:null;e.status=$('#e_status').value.trim();e.vstate=$('#e_vs').value;e.vdate=$('#e_vd').value||null;e.growth=$('#e_g').value.trim();
 const n=$('#e_n').value.trim();if(n){const d=new Date().toISOString().slice(0,10);e.notes=((eff(b).notes||'')+'\n'+d+' note: '+n).trim()}
 edits[b.name]=e;try{localStorage.setItem(LS,JSON.stringify(edits))}catch(x){}toast('Saved');render();drawer(id)}
function revert(id){delete edits[V[id].name];try{localStorage.setItem(LS,JSON.stringify(edits))}catch(x){}render();drawer(id)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m)}catch(e){toast('Clipboard blocked — select & copy manually')}}
const csv=()=>{const rows=V.map(eff).filter(match);const h=['Vendor','Tier','Status','Partner ID','Distributor','Portal check','Last verified','Purchasing vehicle','Click engineers','Growth opportunity','Partner Portal'];
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';return [h.join(','),...rows.map(v=>[v.name,v.tier||'',v.status,v.pid,v.distis.join('; '),v.vstate,v.vdate||'',v.vehicles.join('; '),v.engineers.join(' | '),v.growth,v.links['Partner Portal']||''].map(q).join(','))].join('\n')};
$('#exp').onclick=()=>copy(csv(),'CSV of current view copied');$('#expj').onclick=()=>copy(JSON.stringify(edits,null,1),'Edits copied');
$('#reset').onclick=()=>{edits={};try{localStorage.removeItem(LS)}catch(e){}render();toast('Edits cleared')};
document.addEventListener('click',e=>{const tr=e.target.closest('tr.r');if(tr&&!e.target.closest('a'))return drawer(+tr.dataset.i);
 const th=e.target.closest('th');if(th){const k=th.dataset.k;sort=sort.k===k?{k,d:-sort.d}:{k,d:1};render()}
 const ti=e.target.closest('.tile');if(ti){const f=ti.dataset.f;F.v='';F.t='all';if(f==='top')F.t='top';else if(f!=='all')F.v=f==='pending'?'pending':f;syncUI();render()}
 const sb=e.target.closest('#tierSeg button');if(sb){F.t=sb.dataset.t;syncUI();render()}
 if(!e.target.closest('aside')&&!tr&&!ti)$('#dr').classList.remove('open')});
function syncUI(){document.querySelectorAll('#tierSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===F.t));$('#fv').value=F.v}
const fill=(sel,vals)=>sel.insertAdjacentHTML('beforeend',vals.map(v=>`<option>${esc(v)}</option>`).join(''));
$('#fv').innerHTML='<option value="">Portal check: any</option>'+Object.entries(STATES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
$('#q').oninput=e=>{F.q=e.target.value;render()};$('#fv').onchange=e=>{F.v=e.target.value;render()};$('#fd').onchange=e=>{F.d=e.target.value;render()};$('#fp').onchange=e=>{F.p=e.target.value;render()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus()}if(e.key==='Escape')closeD()});
fetch('data/vendors.json').then(r=>r.json()).then(d=>{DATA=d;V=d.v.map((v,i)=>({...v,id:i}));fill($('#fd'),[...new Set(V.flatMap(v=>v.distis))].sort());fill($('#fp'),[...new Set(V.flatMap(v=>v.vehicles.map(x=>x.split(/[\s:-]/)[0])))].sort());render()}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="padding:30px">Could not load data/vendors.json — serve over http (python3 -m http.server).</p>')});
</script></body></html>
